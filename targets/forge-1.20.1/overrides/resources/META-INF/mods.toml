displayName="Seasick"
authors="Loup0007A"
displayURL="https://github.com/Loup0007A/seasick-mod"
logoFile="seasick_logo.png"
# Mod 100 % client : inutile sur le serveur, et les serveurs n'ont pas besoin de l'avoir.
displayTest="IGNORE_ALL_VERSION"
description='''
Seasick: real motion sickness at sea. Waves are simulated from wind, weather, open water upwind, depth and biome,
and your stomach answers to the motion like a real one (ISO 2631 motion-sickness weighting).
Look at the horizon, take the helm, eat something plain... or lean over the side.
Sea legs, land sickness, a ship's log, an artificial horizon. 100% client-side.

Le mal de mer, pour de vrai : houle simulée, estomac réaliste, pied marin et journal de bord.
'''

[[dependencies.seasick]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

